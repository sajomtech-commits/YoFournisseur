<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>YoFournisseur</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d14;--surface:#16161f;--card:#1c1c2e;--border:#2a2a40;--accent:#00d4aa;--gold:#f0b429;--text:#e8e8f0;--muted:#6b6b8a;--sb:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + var(--sb));min-height:100vh}
a{color:var(--accent);text-decoration:none}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.ht{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ht h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ht .count{background:var(--accent);color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px}
.ht .date{color:var(--muted);font-size:11px;margin-left:auto}
.sb{display:flex;gap:8px;margin-top:10px}
.sb input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.sb input:focus{border-color:var(--accent)}
.tw{overflow-x:auto;white-space:nowrap;padding:10px 16px 0}.ts{display:inline-flex;gap:6px;padding-bottom:10px}
.t{padding:7px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit}
.t.active{background:var(--accent);color:#000;font-weight:600;border-color:var(--accent)}
.st{padding:16px 4px 8px;font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between}
.st .cat-count{font-size:12px;font-weight:400;color:var(--muted)}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
.pc{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform .15s}
.pc:active{transform:scale(.97)}
.pc .iw{width:100%;aspect-ratio:1;background:#111;position:relative;overflow:hidden}
.pc .iw img{width:100%;height:100%;object-fit:cover;display:block}
.pc .ref-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);color:var(--accent);font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;backdrop-filter:blur(4px)}
.pc .inf{padding:8px 10px 10px}
.pc .inf h3{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.pc .inf .cat{font-size:9px;color:var(--muted);background:var(--surface);padding:1px 6px;border-radius:3px;display:inline-block;margin-top:4px}
.pc .inf .price{font-size:13px;font-weight:700;color:var(--gold);margin-top:4px}
.es{text-align:center;padding:60px 20px;color:var(--muted)}.es .big{font-size:56px;margin-bottom:12px}.es h3{font-size:18px;margin-bottom:6px}
/* WhatsApp floating button */
.whatsapp-btn{position:fixed;bottom:calc(16px + var(--sb));right:16px;z-index:99;width:56px;height:56px;border-radius:50%;border:none;background:#25D366;color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:transform .2s}
.whatsapp-btn:active{transform:scale(.9)}
/* WhatsApp menu */
.wa-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);visibility:hidden;opacity:0;transition:opacity .2s}
.wa-overlay.open{visibility:visible;opacity:1}
.wa-menu{position:fixed;bottom:calc(80px + var(--sb));right:16px;z-index:2001;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;min-width:220px;visibility:hidden;opacity:0;transform:scale(.9);transition:all .2s;transform-origin:bottom right}
.wa-menu.open{visibility:visible;opacity:1;transform:scale(1)}
.wa-menu .item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)}
.wa-menu .item:last-child{border:none}
.wa-menu .item:active{background:var(--surface)}
.wa-menu .item .wa-icon{font-size:20px}
.wa-menu .item .wa-name{font-weight:500}
.wa-menu .item .wa-num{color:var(--muted);font-size:12px}
/* Modal */
.mo{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .25s}
.mo.open{visibility:visible;opacity:1}
.md{background:var(--card);border-radius:14px 14px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);position:relative}
.md.open{transform:translateY(0)}.mo.open .md{transform:translateY(0)}
.mh{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto}
.mi{width:100%;max-height:340px;object-fit:contain;background:#111;display:block}
.mb{padding:0 18px 20px}.mb h2{font-size:18px;line-height:1.4;margin-bottom:12px;font-weight:700}
.mb .dr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.mb .dr:last-child{border:none}.mb .dl{color:var(--muted)}.mb .dv{font-weight:500;text-align:right}
.mb .wa-link{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:14px;background:#25D366;color:#fff;border-radius:12px;font-weight:700;font-size:15px}
@media(min-width:768px){.pg{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.pg{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="ht">
<h1>📦 YoFournisseur</h1><span class="count" id="tc">0</span>
<div class="date" id="dateLabel"></div>
</div>
<div class="sb"><input type="text" id="q" placeholder="Rechercher un article..." oninput="OS()" autocomplete="off"></div>
</header>
|<div class="tw"><div class="ts" id="fs"></div></div>
|<div class="tw"><div class="ts" id="ts"></div></div>
<div id="app"></div>
<div class="es hidden" id="es"><div class="big">🔍</div><h3>Aucun résultat</h3></div>
<button class="whatsapp-btn" id="waBtn" onclick="toggleWAMenu()" title="Contacter un fournisseur">💬</button>
<div class="wa-overlay" id="waOverlay" onclick="hideWAMenu()"></div>
<div class="wa-menu" id="waMenu">
<div class="item" style="cursor:default;font-weight:600;color:var(--accent);font-size:13px">💬 Contacter</div>
</div>
<div class="mo" id="mo" onclick="if(event.target===this)CM()"><div class="md" id="md"><div class="mh"></div><img class="mi" id="mi" src=""><div class="mb" id="mb"></div></div></div>
<script>
let P=[],sup=[],supData=[],cat='',FS='';
const $=i=>document.getElementById(i);
const L=async()=>{try{const r=await fetch('data/products.json?t='+Date.now());const d=await r.json();P=d.products||[];supData=d.suppliers||[];E();$('dateLabel').textContent=d.last_updated?new Date(d.last_updated).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}catch(e){P=[];E()}}
const E=()=>{const m={};for(const p of P)if(p.supplier_id&&!m[p.supplier_id])m[p.supplier_id]={id:p.supplier_id,name:p.supplier_name,c:0};sup=Object.values(m).sort((a,b)=>b.c-a.c)}
const G=()=>{let f=P;const q=$('q').value.toLowerCase().trim();if(q)f=f.filter(p=>p.title.toLowerCase().includes(q)||(p.ref||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q))
if(FS)f=f.filter(p=>p.supplier_id===FS)
if(cat)f=f.filter(p=>p.category===cat);return f}
const OS=()=>{cat='';RT();R()}
const RT=()=>{let h='<div class="t '+(cat?'':'active')+'" onclick="SL(\'\')">📂 Toutes <span class="cnt">'+P.length+'</span></div>';const cats={};for(const p of P){const c=p.category||'Autre';cats[c]=(cats[c]||0)+1};Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([n,c])=>{h+='<div class="t '+(n===cat?'active':'')+'" onclick="SL(\''+n+'\')">'+E2(n)+' <span class="cnt">'+c+'</span></div>'});$('ts').innerHTML=h}
const SL=c=>{cat=c;RT();R()}
// Filtre par fournisseur
const BFS=()=>{let h='<div class="t '+(FS?'':'active')+'" onclick="SF(\'\')">📦 Tous <span class="cnt">'+P.length+'</span></div>';for(const s of supData){const c=P.filter(p=>p.supplier_id===s.id).length;if(c)h+='<div class="t '+(FS===s.id?'active':'')+'" onclick="SF(\''+s.id+'\')">'+E2(s.name)+' <span class="cnt">'+c+'</span></div>'}$('fs').innerHTML=h}
const SF=id=>{FS=id;cat='';BFS();RT();R()}
const R=()=>{const c=$('app'),e=$('es'),g=G();$('tc').textContent=P.length;if(!g.length){c.innerHTML='';e.classList.remove('hidden');return}e.classList.add('hidden')
const gr={};for(const p of g){const k=p.category||'Autre';if(!gr[k])gr[k]={n:k,p:[]};gr[k].p.push(p)}let h=''
for(const g2 of Object.values(gr).sort((a,b)=>b.p.length-a.p.length)){h+='<div class="st"><span>📂 '+E2(g2.n)+'</span><span class="cat-count">'+g2.p.length+'</span></div><div class="pg">'
for(const p of g2.p){h+='<div class="pc" onclick="OP('+sq(p.title)+')"><div class="iw"><img src="'+(p.image_url||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23111%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23333%22 font-size=%2230%22%3E📷%3C/text%3E%3C/svg%3E')+'" alt="'+sq(p.title)+'" loading="lazy">'+(p.ref?'<div class="ref-badge">'+E2(p.ref)+'</div>':'')+'</div><div class="inf"><h3>'+E2(p.title)+'</h3><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px"><span class="cat">'+E2(p.category||'')+'</span><span class="cat" style="color:var(--accent)">'+E2(p.supplier_name||'')+'</span></div>'+(p.cPrice?'<div class="price">'+p.currency+E2(p.cPrice)+'</div>':'')+'</div></div>'}
const OP=t=>{const p=P.find(x=>x.title===t);if(!p)return;$('mi').src=p.image_url||'';$('mi').onerror=function(){this.style.display='none'};const s=supData.find(x=>x.id===p.supplier_id);const wa=s&&s.whatsapp?`<a href="https://wa.me/${s.whatsapp.replace(/[^0-9]/g,'')}" target="_blank" class="wa-link" rel="noopener">💬 Contacter ${E2(s.whatsapp_name||'le fournisseur')}</a>`:''
$('mb').innerHTML=(p.ref?'<div class="ref">📌 '+E2(p.ref)+'</div>':'')+'<h2>'+E2(p.title)+'</h2><div class="dr"><span class="dl">📂 Catégorie</span><span class="dv">'+E2(p.category||'—')+'</span></div><div class="dr"><span class="dl">🔗 Fournisseur</span><span class="dv"><a href="'+EA(s&&s.url||'#')+'" target="_blank" rel="noopener">'+E2(s&&s.name||'')+'</a></span></div>'+(p.cPrice?'<div class="dr"><span class="dl">💰 Prix</span><span class="dv">'+p.currency+E2(p.cPrice)+'</span></div>':'')+(p.price?'<div class="dr"><span class="dl">🏷️ Prix origine</span><span class="dv">'+p.currency+E2(p.price)+'</span></div>':'')+wa;$('mo').classList.add('open');$('md').classList.add('open')}
const CM=()=>{$('mo').classList.remove('open');$('md').classList.remove('open')}
const E2=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const EA=s=>String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
const sq=s=>String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')
const toggleWAMenu=()=>{$('waOverlay').classList.toggle('open');$('waMenu').classList.toggle('open');buildWAMenu()}
const hideWAMenu=()=>{$('waOverlay').classList.remove('open');$('waMenu').classList.remove('open')}
const buildWAMenu=()=>{const el=$('waMenu');let h=el.innerHTML.split('<div class="item"')[0]+'<div class="item" style="cursor:default;font-weight:600;color:var(--accent);font-size:13px">💬 Contacter</div>';supData.filter(s=>s.whatsapp).forEach(s=>{const n=s.whatsapp.replace(/[^0-9]/g,'');h+='<div class="item" onclick="window.open(\'https://wa.me/'+n+'\',\'_blank\');hideWAMenu()"><span class="wa-icon">💬</span><div><div class="wa-name">'+E2(s.name)+'</div><div class="wa-num">'+E2(s.whatsapp)+'</div></div></div>'});if(!supData.some(s=>s.whatsapp))h+='<div class="item" style="color:var(--muted);font-size:13px">Aucun contact</div>';el.innerHTML=h}
const openWA=sid=>{const s=supData.find(x=>x.id===sid);if(s&&s.whatsapp){const n=s.whatsapp.replace(/[^0-9]/g,'');window.open('https://wa.me/'+n,'_blank')}}
document.addEventListener('DOMContentLoaded',async()=>{await L();BFS();RT();R()})
</script>
</body>
</html>
